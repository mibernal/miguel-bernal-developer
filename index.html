    <script>
      (function (location) {
        if (!location.search.startsWith("?/")) {
          return;
        }
        const decoded = location.search
          .slice(2)
          .split("&")
          .map(function (segment) {
            return segment.replace(/~and~/g, "&");
          })
          .join("?");
        const newUrl = location.pathname.replace(/\/$/, "") + "/" + decoded + location.hash;
        window.history.replaceState(null, "", newUrl);
      })(window.location);
    </script>
